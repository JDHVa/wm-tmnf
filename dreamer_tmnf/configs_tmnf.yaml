tmnf:
  task: tmnf_A01
  steps: 1e6
  action_repeat: 1
  envs: 1
  time_limit: 1200
  size: [64, 64]
  prefill: 2500
  pretrain: 10
  train_ratio: 128
  eval_episode_num: 0
  eval_every: 10000
  log_every: 2000
  video_pred_log: true
  dataset_size: 300000
  compile: false
  dyn_hidden: 512
  dyn_deter: 512
  dyn_stoch: 32
  dyn_discrete: 32
  units: 512
  encoder: {mlp_keys: 'vector', cnn_keys: 'image', cnn_depth: 32, mlp_layers: 2, mlp_units: 256}
  decoder: {mlp_keys: 'vector', cnn_keys: 'image', cnn_depth: 32, mlp_layers: 2, mlp_units: 256}
  actor: {layers: 2, dist: 'onehot', std: 'none', entropy: 3e-3}
  imag_gradient: 'reinforce'
  batch_size: 16
  batch_length: 64
